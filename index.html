<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeautyFlow Pro — Painel de Gestão</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

    :root {
      --bg: #f8f7f5;
      --surface: #ffffff;
      --surface-subtle: #f3f2ee;
      --text: #23201b;
      --text-muted: #7f7a72;
      --border: #e6e3dd;
      --primary: #6941c6;
      --primary-hover: #5332a6;
      --primary-light: #f4f0fd;
      --success: #127953;
      --success-light: #e6f6ee;
      --warning: #b54708;
      --warning-light: #fffaeb;
      --info: #175cd3;
      --info-light: #eff8ff;
      --danger: #b42318;
      --sidebar-width: 250px;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 4px 14px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 12px 30px rgba(16, 24, 40, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    /* BARRA LATERAL */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .brand {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #9e77ed);
      color: #fff;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 18px;
      border-radius: 10px;
      display: grid;
      place-items: center;
    }

    .brand-title {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .brand-title span { color: var(--primary); }

    .nav-scroll {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-group-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 0 10px;
      margin-bottom: 6px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      background: transparent;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #475467;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .badge-count {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 12px;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #dfc8b6;
      color: #63381a;
      font-weight: 700;
      display: grid;
      place-items: center;
      font-size: 13px;
    }

    .profile-info strong {
      display: block;
      font-size: 13px;
      color: var(--text);
    }

    .profile-info small {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* CORPO PRINCIPAL */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      place-items: center;
    }

    .topbar-title {
      font-size: 14px;
      color: var(--text-muted);
    }

    .topbar-title strong {
      color: var(--text);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 9px;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      color: #475467;
      transition: background 0.15s;
    }

    .btn-icon:hover { background: var(--surface-subtle); }

    .btn-icon .dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 7px;
      height: 7px;
      background: var(--danger);
      border-radius: 50%;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 38px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { background: var(--surface-subtle); }

    /* CONTEÚDO DINÂMICO */
    .content-area {
      padding: 28px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
    }

    .page-header h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* CARDS DE MÉTRICAS */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .metric-val {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin: 10px 0 6px;
      letter-spacing: -0.6px;
    }

    .metric-badge {
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .metric-badge.green { color: var(--success); }
    .metric-badge.orange { color: var(--warning); }

    /* GRID DO PAINEL PRINCIPAL */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    /* AGENDA VISUAL */
    .calendar-mockup {
      padding: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .cal-day-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cal-day-header {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
    }

    .cal-day-header.today {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .cal-slot {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .cal-slot:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .cal-slot.active-slot {
      background: var(--primary-light);
      border-color: #d6bbfb;
      color: #5332a6;
    }

    .cal-slot strong {
      font-size: 12px;
      color: var(--text);
    }

    /* LISTA DE ATENDIMENTOS */
    .appointment-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .appointment-item:last-child { border-bottom: 0; }

    .appt-meta strong {
      display: block;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .appt-meta span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-tag {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-confirmed { background: var(--success-light); color: var(--success); }
    .status-pending { background: var(--warning-light); color: var(--warning); }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 40, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: grid; }

    .modal-box {
      background: var(--surface);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Manrope', sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: 0;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #344054;
    }

    .form-group input, .form-group select {
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: 0;
      background: #fff;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(105, 65, 198, 0.12);
    }

    .modal-footer {
      padding: 16px 22px;
      background: var(--surface-subtle);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* TOAST DE FEEDBACK */
    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1d2939;
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: var(--shadow-lg);
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 200;
      pointer-events: none;
    }

    .toast-box.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* TABELAS PARA OUTRAS SEÇÕES */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .data-table th {
      background: var(--surface-subtle);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    /* RESPONSIVIDADE */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: var(--shadow-lg);
      }

      .main-wrapper {
        margin-left: 0;
      }

      .menu-toggle {
        display: grid;
      }

      .dashboard-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  </aside>

  <!-- ÁREA DE OPERAÇÃO -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="btnToggleMenu" aria-label="Abrir Menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>

    </header>

    <div class="content-area">
      
      <!-- 1. DASHBOARD -->
      <section class="view-section active" id="view-dashboard">

          <div>

        <div class="metrics-grid">
